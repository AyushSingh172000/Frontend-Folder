    <table align="center" border="1px" cellpadding="20px" rules="all">
        <thead>
            <tr align="center">
                <th>Days</th>
                <th>1<sup>st</sup>Half</th>
                <th>BREAK</th>
                <th>2<sup>nd</sup>Half</th>
            </tr>
        </thead>
        <tbody>
            <tr align="center">
                <td>MONDAY</td>
                <TD>JAVA</TD>
                <TD rowspan="5">LUNCH</TD>
                <TD>DBMS</TD>
            </tr>
            <TR align="center">
                <TD>TUESDAY</TD>
                <TD>OS</TD>
                <TD>NETWORKING</TD>
            </TR>
            <TR align="center">
                <TD>WEDNESDAY</TD>
                <TD>HTML</TD>
                <TD>CSS</TD>
            </TR>
            <TR align="center">
                <TD>THURSDAY</TD>
                <TD>JAVASCRIPT</TD>
                <TD>DSA</TD>
            </TR>
            <TR align="center">
                <TD>FRIDAY</TD>
                <TD>AI/ML</TD>
                <TD>CYBER SECURITY</TD>
            </TR>
        </tbody>
        <tfoot>
            <TR align="center">
                <TD>SATURDAY</TD>
                <TD colspan="3">WEEK OFF</TD>
            </TR>
            <TR align="center">
                <TD>SUNDAY</TD>
                <TD colspan="3">HOLIDAY</TD>
            </TR>
        </tfoot>
       
    </table>
